- name: "Session 9: TACL Journal"
  date: "Tuesday 29 July"
  time: "14:00-15:30"
  location: "Hall B"
  papers:
  - author: "Roman Vashurin Ekaterina Fadeeva Artem Vazhentsev Lyudmila Rvanova Akim Tsvigun Daniil Vasilev Rui Xing Abdelrahman “Boda” Sadallah Kirill Grishchenkov Sergey Petrakov Alexander Panchenko Timothy Baldwin Preslav Nakov Maxim Panov Artem Shelmanov"
    title: "Benchmarking Uncertainty Quantification Methods for Large Language Models with LM-Polygraph"
    time: "15:06 - 15:17"
    abstract: "The rapid proliferation of large language models (LLMs) has stimulated researchers to seek effective and efficient approaches to deal with LLM hallucinations and low-quality outputs. Uncertainty quantification (UQ) is a key element of machine learning applications in dealing with such challenges. However, research to date on UQ for LLMs has been fragmented in terms of techniques and evaluation methodologies. In this work, we address this issue by introducing a novel benchmark that implements a collection of state-of-the-art UQ baselines and offers an environment for controllable and consistent evaluation of novel UQ techniques over various text generation tasks. Our benchmark also supports the assessment of confidence normalization methods in terms of their ability to provide interpretable scores. Using our benchmark, we conduct a large-scale empirical investigation of UQ and normalization techniques across eleven tasks, identifying the most effective approaches."
  - author: "Xinghua Zhang Bowen Yu Haiyang Yu Yangyu Lv Tingwen Liu Fei Huang Hongbo Xua Yongbin Li"
    title: "BroadLLM: Wider and Deeper LLM Networks are Fairer LLM Evaluators"
    time: "15:17 - 15:28"
    abstract: "Measuring the quality of responses generated by LLMs is a challenging task, particularly when it comes to evaluating whether the response is aligned with human preference. A novel approach involves using the LLM itself to make evaluation and stabilizing the results through multiple independent evaluations, similar to a single-layer narrow LLM network. This network consists of a fixed number of nodes, with each node being the same LLM. This paper draws upon the extensive research to explore whether wider and deeper networks can lead to fairer evaluations. Specifically, we first adaptively generate diverse node roles for each evaluation sample. Each perspective corresponds to the role of a specific LLM node in the first layer. In subsequent layers, we integrate the locally learned evaluation information from all nodes in the previous layer to obtain a more comprehensive evaluation result. Interestingly, this network design resembles the process of academic paper reviewing, where reviewers rate independently and then consider others’ opinions to reach a final decision. To validate the effectiveness, we construct the largest and most diverse evaluation benchmark LLMEval2 for LLM evaluators. Experimental results demonstrate that a wider network with 2 layers performs the best (named as BroadLLM).1 It also boosts Chinese LLM evaluation by 4.6×, saving 60% costs with 93% human agreement."
  - author: "Chaitanya Malaviya Joseph Chee Chang Dan Roth Mohit Iyyer Mark Yatskar Kyle Loa"
    title: "Contextualized Evaluations: Taking the Guesswork Out of Language Model Evaluations"
    time: "15:17 - 15:28"
    abstract: "Language model users often issue queries that lack specification, where the context under which a query was issued---such as the user's identity, the query's intent, and the criteria for a response to be useful---is not explicit. For instance, a good response to a subjective query like “What book should I read next?” would depend on the user’s preferences, and a good response to an open-ended query like “How do antibiotics work against bacteria?” would depend on the user's expertise. This makes evaluation of responses to such queries an ill-posed task, as evaluators must make uninformed judgements about the quality of a response. To remedy this, we present contextualized evaluations, a protocol that synthetically constructs context surrounding an underspecified query and provides it during evaluation. We find that the presence of context can 1) change conclusions drawn from evaluation, even flipping win rates between model pairs, 2) nudge evaluators to make fewer judgments based on surface-level criteria of responses, like style, and 3) provide new insights about model behavior in different contexts. Specifically, we discover an implicit bias towards WEIRD contexts in default responses and find that models are not equally sensitive to following different contexts."
